<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Document</title>
</head>

<body>
    <div class="container">
        <h1>Personal Blog</h1>
        <form id="personalBlogForm" novalidate>
            <div class="formGroup">
                <label for="title">Title</label>
                <input type="text" id="title" name="title" placeholder="Good Product" required>
                <span class="errorSpan" id="titleSpan"></span>
            </div>
            <div class="formGroup">
                <label for="content">Your Message</label>
                <textarea type="text" id="content" placeholder="Please Enter Your Mesage" minlength="100" rows="25"
                    cols="50" required></textarea>
                <span class="errorSpan" id="contentSpan"></span>
            </div>
            <button type="submit">Send</button>
        </form>

        <h3>Posts</h3>
        <ul id="list"></ul>
    </div>
    <script src="script.js"></script>
</body>

</html>
